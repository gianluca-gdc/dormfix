spring.application.name=dormfix
server.port=8080

# Health check at http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health

# SQLite database. The file dormfix.db is created automatically in the folder
# you run the server from. Open it with DB Browser for SQLite to see the tables.
spring.datasource.url=jdbc:sqlite:dormfix.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite only allows one writer at a time, so keep a single connection
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# "update" creates/updates tables from the @Entity classes. Fine for a class project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
